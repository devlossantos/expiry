# Tests, scans, builds and publishes the image to GitHub Container Registry (ghcr.io).
# No secrets to configure: it authenticates with the built-in GITHUB_TOKEN.
#   pull request  -> tests + image scan (nothing published)
#   push to main  -> ghcr.io/<owner>/<repo>:edge
#   tag v1.2.3    -> ghcr.io/<owner>/<repo>:1.2.3, :1.2, :latest + a GitHub Release with notes
#                    (the app's version comes from the tag: no version to edit in any file)
#   every Monday  -> re-scan the published :latest image for newly disclosed vulnerabilities
# Scan results appear under the repo's Security tab > Code scanning. A CRITICAL vulnerability
# that has a fix available stops the image from being published. Dependency vulnerabilities are
# also reported by Dependabot security alerts (repo Settings > Code security).
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  TRIVY: aquasec/trivy:0.75.0  # pinned; bump deliberately

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]   # every version pyproject.toml supports
    name: test (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the version
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python lint (ruff; rules in pyproject.toml)
        run: pip install ruff==0.16.9 && ruff check src tests
      - name: Shell script lint (shellcheck)
        run: shellcheck scripts/*.sh

  image:
    needs: [test, lint]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # upload scan results to the Security tab
      id-token: write          # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the version

      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: App version from git (tag v1.2.3 -> 1.2.3; main -> 1.2.4.devN+g<commit>)
        run: |
          python3 -m pip install -q setuptools-scm
          echo "VERSION=$(python3 -m setuptools_scm)" >> "$GITHUB_ENV"
          python3 -m setuptools_scm

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 1. build a local copy and scan it BEFORE anything is published
      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: expiry:scan
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image (version, installer, daemon, CLI)
        run: |
          set -eux
          # the version comes from the tag
          test "$(docker run --rm expiry:scan --version)" = "expiry, version $VERSION"
          # the installer writes the wrapper, man page and starter config
          mkdir -p smoke/bin smoke/man smoke/config smoke/run
          docker run --rm -u 0 -v "$PWD/smoke/bin:/host/bin" -v "$PWD/smoke/man:/host/man" \
            -v "$PWD/smoke/config:/host/config" expiry:scan install
          test -x smoke/bin/expiry && test -s smoke/man/expiry.1 && test -s smoke/config/config.yaml
          # the daemon starts with a minimal config and the CLI works against it
          printf 'email:\n  enabled: false\nsources:\n  ssl:\n    enabled: false\n' > smoke/run/config.yaml
          docker run -d --name smoke -v "$PWD/smoke/run:/config:ro" expiry:scan
          for i in $(seq 1 30); do docker exec smoke expiry health && break; sleep 2; done
          docker exec smoke expiry health
          docker exec smoke expiry config check
          docker exec smoke expiry add "CI smoke test" +30d
          docker exec smoke expiry list
          docker exec smoke expiry backup create
          docker exec smoke expiry status
          # no crash or broken logging in the service output
          docker logs smoke 2>&1 | tee smoke/daemon.log
          ! grep -E "Traceback|Logging error" smoke/daemon.log

      - name: Remove smoke test container
        if: always()
        run: docker rm -f smoke || true

      - name: Scan image (report to Security tab)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            -v "$PWD:/out" "$TRIVY" image --no-progress --scanners vuln,secret \
            --severity CRITICAL,HIGH,MEDIUM --ignore-unfixed --format sarif --output /out/trivy.sarif expiry:scan

      - name: Upload scan results
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: image

      - name: Fail on critical fixable vulnerabilities or leaked secrets
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            "$TRIVY" image --no-progress --scanners vuln,secret --severity CRITICAL --ignore-unfixed \
            --exit-code 1 expiry:scan

      # 2. publish (not for pull requests)
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true               # list of everything inside the image (SBOM)
          provenance: mode=max     # how and from which commit it was built

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # tag v1.2.3: a GitHub Release page with notes generated from the commits since the last tag
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  # weekly: new vulnerabilities are published every day, so re-check what people are running
  scan-published:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
      - name: Scan published image
        run: |
          docker run --rm -v "$PWD:/out" "$TRIVY" image --no-progress --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM --ignore-unfixed --format sarif --output /out/trivy.sarif "$IMAGE"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: published-latest
      - name: Fail (GitHub emails you) on critical fixable vulnerabilities
        run: |
          docker run --rm "$TRIVY" image --no-progress --scanners vuln --severity CRITICAL --ignore-unfixed \
            --exit-code 1 "$IMAGE"
