[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "expiry"
dynamic = ["version"]   # from the git tag (setuptools-scm): tag v1.2.3 -> version 1.2.3
description = "Track expiring secrets, certificates and anything else - with Entra ID + SSL sync and email reminders."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "msal>=1.35",
  "requests>=2.31",
  "APScheduler>=3.10,<4",
  "cryptography>=42",
  "tzdata",
]

[project.urls]
Homepage = "https://github.com/devlossantos/expiry"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
expiry = "expiry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expiry = ["templates/*"]

[tool.setuptools_scm]
# Docker builds have no .git: CI passes the version (SETUPTOOLS_SCM_PRETEND_VERSION);
# a local build without it reports this
fallback_version = "0.0.0+local"

[tool.pytest.ini_options]
testpaths = ["tests"]
